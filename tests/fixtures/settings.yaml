# tests/fixtures/settings.yaml — synthetic reference-format settings.
#
# This file is the reference-side half of the fixture pair: the reference
# generator reads it, tools/import-settings.mjs must convert it into exactly
# tests/fixtures/settings.json, and both must produce config.json byte for byte
# identical to tests/fixtures/expected-config.json.
#
# The data is synthetic: no real server addresses, no personal lists. It mirrors
# conftest.DEFAULT_SETTINGS of the reference test suite (2 inbounds, one of them
# with its own urltest pool, one domain route, 🇷🇺 excluded from auto-select).
listen_ip: 127.0.0.1
links_file: links.txt
output_file: config.json
exclude_from_auto:
- "🇷🇺"
urltest:
  url: "https://gstatic.com"
  interval: "3m"
  tolerance: 50
log:
  level: info
  timestamp: true
dns:
  servers:
  - type: local
    tag: dns-local
  final: dns-local
proxies:
- tag: main-socks
  type: socks
  port: 54321
- tag: apps-http
  type: http
  port: 54323
  servers:
  - 🇫🇮 Finland - Helsinki 1
  - 🇳🇱 Netherlands - Amsterdam
routes:
  telegram:
    outbound: auto-select
    domains:
    - t.me
    - telegram.org
